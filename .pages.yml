media:
  - name: covers
    label: صور الأغلفة 16:9
    input: assets/uploads/covers
    output: /assets/uploads/covers
    rename: safe
    extensions: [jpg, jpeg, png, webp]
  - name: content_images
    label: صور داخل المحتوى
    input: assets/uploads/content
    output: /assets/uploads/content
    rename: safe
    extensions: [jpg, jpeg, png, webp]

content:
  - name: articles
    label: المقالات
    type: collection
    path: _articles
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, status, category, date]
      sort: date
      order: desc
    fields:
      - name: title
        label: عنوان المقال
        type: string
        required: true
      - name: excerpt
        label: الملخص الظاهر في البطاقة
        type: text
        required: true
        options:
          maxlength: 220
      - name: date
        label: تاريخ النشر
        type: date
        required: true
      - name: status
        label: حالة المحتوى
        type: select
        required: true
        options:
          values:
            - name: draft
              label: مسودة — غير ظاهرة
            - name: published
              label: منشور — ظاهر على الموقع
      - name: category
        label: التصنيف
        type: select
        required: true
        options:
          values: [إعلانات ممولة, صناعة المحتوى, ذكاء اصطناعي, تحليل أداء, Workflows]
      - name: category_key
        label: فلتر القسم
        type: select
        required: true
        options:
          values:
            - name: ads
              label: إعلانات
            - name: content
              label: محتوى
            - name: ai
              label: AI
      - name: read_time
        label: مدة القراءة
        type: string
        description: "مثال: 8 دقائق"
      - name: cover
        label: صورة الغلاف
        type: image
        description: الأفضل 1600×900 بنسبة 16:9، JPG أو WebP.
        options:
          media: covers
          rename: safe
      - name: gallery
        label: صور إضافية داخل المقال
        type: image
        description: ارفع حتى 12 صورة. الأفضل 1400×933 بنسبة 3:2؛ وستظهر تلقائيًا بعد نص المقال.
        options:
          media: content_images
          multiple:
            max: 12
          unique: true
          rename: safe
      - name: highlight_color
        label: لون التمييز
        type: select
        required: true
        options:
          values:
            - name: lime
              label: أخضر الهوية
            - name: cyan
              label: سماوي الهوية
      - name: seo_description
        label: وصف محركات البحث SEO
        type: text
        description: اكتب من 120 إلى 160 حرفًا.
        options:
          maxlength: 160
      - name: body
        label: محتوى المقال
        type: rich-text
        required: true
        options:
          format: markdown
          media: content_images
          rename: safe
          switcher: false

  - name: case_studies
    label: دراسات الحالة
    type: collection
    path: _case_studies
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, status, industry, date]
      sort: date
      order: desc
    fields:
      - name: title
        label: اسم المشروع أو البراند
        type: string
        required: true
      - name: excerpt
        label: ملخص دراسة الحالة
        type: text
        required: true
        options:
          maxlength: 220
      - name: date
        label: تاريخ الإضافة
        type: date
        required: true
      - name: status
        label: حالة المحتوى
        type: select
        required: true
        options:
          values:
            - name: draft
              label: مسودة — غير ظاهرة
            - name: published
              label: منشور — ظاهر على الموقع
      - name: industry
        label: القطاع
        type: string
        description: "مثال: E-COMMERCE أو F&B"
      - name: scope_label
        label: نوع المشروع
        type: string
        description: "مثال: FULL FUNNEL أو CREATIVE SYSTEM"
      - name: tags
        label: نطاق العمل
        type: string
        list: true
        description: "مثال: Media Buying، Tracking، Content Strategy"
      - name: cover
        label: صورة الغلاف
        type: image
        description: الأفضل 1600×900 بنسبة 16:9، JPG أو WebP.
        options:
          media: covers
          rename: safe
      - name: gallery
        label: صور إضافية داخل دراسة الحالة
        type: image
        description: ارفع صور النتائج والتصاميم ولقطات الشاشة. ستظهر تلقائيًا بعد التفاصيل.
        options:
          media: content_images
          multiple:
            max: 16
          unique: true
          rename: safe
      - name: highlight_color
        label: لون التمييز
        type: select
        required: true
        options:
          values:
            - name: lime
              label: أخضر الهوية
            - name: cyan
              label: سماوي الهوية
      - name: seo_description
        label: وصف محركات البحث SEO
        type: text
        options:
          maxlength: 160
      - name: body
        label: تفاصيل دراسة الحالة
        type: rich-text
        required: true
        options:
          format: markdown
          media: content_images
          rename: safe
          switcher: false

  - name: landing_pages
    label: Landing Pages
    type: collection
    path: _landing_pages
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, status, service_name]
    fields:
      - name: title
        label: اسم الصفحة داخل اللوحة
        type: string
        required: true
      - name: status
        label: حالة الصفحة
        type: select
        required: true
        options:
          values:
            - name: draft
              label: مسودة — غير مفهرسة
            - name: published
              label: منشورة
      - name: slug
        label: رابط الصفحة بالإنجليزي
        type: string
        required: true
        description: "مثال: media-buying"
      - name: service_name
        label: اسم الخدمة للتتبع
        type: string
        required: true
        description: "مثال: media_buying"
      - name: eyebrow
        label: السطر الصغير أعلى العنوان
        type: string
      - name: headline
        label: العنوان الرئيسي
        type: string
        required: true
      - name: headline_accent
        label: الجزء الأخضر من العنوان
        type: string
        required: true
      - name: lead
        label: وصف العرض
        type: text
        required: true
      - name: cover
        label: صورة أو غلاف الصفحة
        type: image
        description: الأفضل 1600×900 أو WebP.
        options:
          media: covers
          rename: safe
      - name: cover_alt
        label: وصف الصورة
        type: string
      - name: tags
        label: المنصات أو نقاط الثقة
        type: string
        list: true
      - name: nav_cta
        label: زر أعلى الصفحة
        type: string
      - name: form_title
        label: عنوان نموذج الطلب
        type: string
      - name: form_intro
        label: وصف نموذج الطلب
        type: text
      - name: budget_options
        label: اختيارات الميزانية
        type: string
        list: true
      - name: cta_text
        label: نص زر الإرسال
        type: string
      - name: benefit_1_title
        label: الميزة الأولى — العنوان
        type: string
      - name: benefit_1_text
        label: الميزة الأولى — الوصف
        type: string
      - name: benefit_2_title
        label: الميزة الثانية — العنوان
        type: string
      - name: benefit_2_text
        label: الميزة الثانية — الوصف
        type: string
      - name: benefit_3_title
        label: الميزة الثالثة — العنوان
        type: string
      - name: benefit_3_text
        label: الميزة الثالثة — الوصف
        type: string
      - name: section_title
        label: عنوان خطوات العمل
        type: string
      - name: step_1_title
        label: الخطوة الأولى — العنوان
        type: string
      - name: step_1_text
        label: الخطوة الأولى — الوصف
        type: text
      - name: step_2_title
        label: الخطوة الثانية — العنوان
        type: string
      - name: step_2_text
        label: الخطوة الثانية — الوصف
        type: text
      - name: step_3_title
        label: الخطوة الثالثة — العنوان
        type: string
      - name: step_3_text
        label: الخطوة الثالثة — الوصف
        type: text
      - name: seo_title
        label: عنوان SEO
        type: string
      - name: seo_description
        label: وصف SEO
        type: text
        options:
          maxlength: 160
      - name: body
        label: محتوى إضافي اختياري
        type: rich-text
        options:
          format: markdown
          media: content_images
          rename: safe
          switcher: false

  - name: tracking_settings
    label: إعدادات التتبع
    type: file
    path: _data/tracking.yml
    format: yaml
    fields:
      - name: gtm
        label: Google Tag Manager ID
        type: string
        description: "مثال: GTM-XXXXXXX"
      - name: ga4
        label: GA4 Measurement ID
        type: string
        description: "مثال: G-XXXXXXXXXX"
      - name: meta_pixel
        label: Meta Pixel ID
        type: string
      - name: tiktok_pixel
        label: TikTok Pixel ID
        type: string
      - name: snap_pixel
        label: Snapchat Pixel ID
        type: string
